<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lily - Med Spa Voice Bot (Gemini 3.8 Live)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .status {
      background: #f5f5f5;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #666;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status.connected {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .status.recording {
      background: #fff3cd;
      color: #856404;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .transcript {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      height: 300px;
      overflow-y: auto;
      padding: 16px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    .transcript-item {
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.4;
    }

    .transcript-item.customer {
      background: #e3f2fd;
      color: #1565c0;
      text-align: right;
      margin-left: 20px;
    }

    .transcript-item.bot {
      background: #f3e5f5;
      color: #6a1b9a;
      margin-right: 20px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-start {
      background: #667eea;
      color: white;
    }

    .btn-start:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-start:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #f44336;
      color: white;
    }

    .btn-stop:hover:not(:disabled) {
      background: #da190b;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
    }

    .btn-stop:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
    }

    .cost {
      font-weight: 600;
      color: #667eea;
    }

    .waveform {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 30px;
      justify-content: center;
      margin: 20px 0;
    }

    .waveform-bar {
      width: 3px;
      background: #667eea;
      border-radius: 2px;
      animation: wave 0.6s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎤 Lily</h1>
      <p>Med Spa Voice Bot (Gemini 3.8 Live)</p>
    </div>

    <div class="status" id="status">
      <span class="status-dot"></span>
      Connecting...
    </div>

    <div class="transcript" id="transcript"></div>

    <div id="recordingIndicator" class="waveform" style="display: none;">
      <div class="waveform-bar"></div>
      <div class="waveform-bar" style="animation-delay: 0.1s;"></div>
      <div class="waveform-bar" style="animation-delay: 0.2s;"></div>
      <div class="waveform-bar" style="animation-delay: 0.3s;"></div>
      <div class="waveform-bar" style="animation-delay: 0.4s;"></div>
    </div>

    <div class="controls">
      <button class="btn-start" id="startBtn" onclick="startCall()">Start Call</button>
      <button class="btn-stop" id="stopBtn" onclick="stopCall()" disabled>Stop Call</button>
    </div>

    <div class="info">
      <span id="duration">Duration: 0:00</span>
      <span class="cost">Cost: $<span id="cost">0.00</span></span>
    </div>
  </div>

  <script>
    let ws = null;
    let mediaStream = null;
    let audioContext = null;
    let processor = null;
    let callStartTime = null;
    let durationInterval = null;

    // Connect WebSocket
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        updateStatus('Ready to call', 'connected');
        document.getElementById('startBtn').disabled = false;
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'transcript') {
          addTranscript(msg.speaker, msg.text);
        } else if (msg.type === 'audio') {
          playAudio(msg.data);
        } else if (msg.type === 'error') {
          updateStatus(msg.message, 'error');
        } else if (msg.type === 'status') {
          updateStatus(msg.message, 'connected');
        }
      };

      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
        updateStatus('Connection error', 'error');
      };

      ws.onclose = () => {
        updateStatus('Disconnected', 'error');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
      };
    }

    async function startCall() {
      try {
        // Request microphone access
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false,
          } 
        });
        mediaStream = stream;

        // Create audio context
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        
        // ScriptProcessor for real-time audio capture
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        source.connect(processor);
        processor.connect(audioContext.destination);

        // Send audio chunks to server
        processor.onaudioprocess = (event) => {
          const audioData = event.inputData[0];
          const pcmData = new Int16Array(audioData.length);
          
          // Convert float32 to int16
          for (let i = 0; i < audioData.length; i++) {
            pcmData[i] = Math.max(-1, Math.min(1, audioData[i])) < 0 
              ? audioData[i] * 0x8000 
              : audioData[i] * 0x7FFF;
          }
          
          // Send as ArrayBuffer
          ws.send(pcmData.buffer);
        };

        // UI state
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('transcript').innerHTML = '';
        document.getElementById('recordingIndicator').style.display = 'flex';
        callStartTime = Date.now();

        updateStatus('Call in progress...', 'recording');

        // Update duration and cost display
        durationInterval = setInterval(() => {
          const elapsed = Math.round((Date.now() - callStartTime) / 1000);
          const mins = Math.floor(elapsed / 60);
          const secs = elapsed % 60;
          document.getElementById('duration').textContent = `Duration: ${mins}:${secs.toString().padStart(2, '0')}`;

          // Estimate cost: ~25 tokens/sec, $3.00/M input + $12.00/M output = $0.0375/sec = $2.25/min average
          // More realistic: $1.38/hr = $0.023/min
          const cost = (elapsed / 60) * 0.023;
          document.getElementById('cost').textContent = cost.toFixed(4);
        }, 1000);

      } catch (err) {
        if (err.name === 'NotAllowedError') {
          updateStatus('Microphone permission denied', 'error');
        } else {
          updateStatus(`Error: ${err.message}`, 'error');
        }
        console.error('Mic error:', err);
      }
    }

    function stopCall() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (processor) {
        processor.disconnect();
      }
      if (audioContext) {
        audioContext.close();
      }
      if (durationInterval) {
        clearInterval(durationInterval);
      }

      ws.close();

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('recordingIndicator').style.display = 'none';
      updateStatus('Call ended', 'connected');
    }

    function addTranscript(speaker, text) {
      const item = document.createElement('div');
      item.className = `transcript-item ${speaker}`;
      item.textContent = text;
      document.getElementById('transcript').appendChild(item);
      document.getElementById('transcript').scrollTop = document.getElementById('transcript').scrollHeight;
    }

    function playAudio(base64Audio) {
      try {
        const binary = atob(base64Audio);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        
        const audioBlob = new Blob([bytes], { type: 'audio/mp3' });
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        audio.play().catch(err => console.error('Audio play error:', err));
      } catch (err) {
        console.error('Audio playback error:', err);
      }
    }

    function updateStatus(message, className) {
      const status = document.getElementById('status');
      status.className = `status ${className}`;
      status.innerHTML = `<span class="status-dot"></span>${message}`;
    }

    // Connect WebSocket on page load
    window.onload = () => {
      connectWebSocket();
    };
  </script>
</body>
</html>
